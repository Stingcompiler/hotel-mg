name: CI

on:
  push:
    branches: ["**"]  # every branch: CI must be green before merging into main
  pull_request:

jobs:
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux for development sessions; Windows because that is where the service runs.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
        shell: bash
    env:
      SKYTOWERS_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yml
      - name: Tests
        run: |
          python -m pytest --cov --cov-report=term-missing:skip-covered --junitxml=junit.xml \
            || { python ../build/junit_annotations.py junit.xml; exit 1; }
      - name: rules.py fully covered (spec §12 gate)
        run: python -m coverage report --include="apps/*/rules.py" --fail-under=100
      - name: Seed loads
        run: |
          python manage.py migrate -v0
          python manage.py seed_demo --allow-non-debug

  api-contract:
    # API freeze (spec §12): the committed schema, TS types and Postman collection match the code.
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: pip install -r server/requirements-dev.txt
      - name: Regenerate schema, types and collection
        run: |
          (cd server && python manage.py spectacular --validate --fail-on-warn --file ../api/openapi.yml)
          (cd api && npm ci --no-audit --no-fund && npm run gen && npx tsc --noEmit --strict schema.d.ts)
          python build/postman_collection.py
      - name: Committed contract is up to date
        run: |
          git diff --exit-code -- api/ || {
            echo "::error::api/ is out of date with the code. Regenerate (see api/README.md) and commit.";
            exit 1;
          }

  web:
    # F1 foundation (spec §12): tokens from the design package, UI greps, types against api/, tests, build.
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tokens are generated from design-package/tokens.json
        run: |
          node ../build/tokens-to-tailwind.ts
          git diff --exit-code -- src/design/tokens.css tailwind.preset.ts || {
            echo "::error::tokens.css / tailwind.preset.ts are stale. Run node build/tokens-to-tailwind.ts and commit.";
            exit 1;
          }
      - name: UI rules (hex, physical direction, Latin strings)
        run: npm run check:ui
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
