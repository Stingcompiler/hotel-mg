name: Windows release

# Track W (spec §12): the Windows service bundle and the NSIS installer, built and smoke-tested on
# windows-latest because a Linux session cannot. Runs on every change to the Windows pieces, on
# `v*` tags, and on demand; the installer is uploaded as an artifact.
on:
  workflow_dispatch:
  # A new version on main (tauri.conf.json) is tested, built and published once; other merges publish nothing.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "build/windows/**"
      - "build/build_spa.py"
      - "server/service/**"
      - "server/requirements.txt"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write  # publish the GitHub release
  pull-requests: write  # the installer end-to-end transcript is posted on the PR (job logs are not reachable everywhere)

# Two merges close together never race to publish (review 2026-09-29, E-2).
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish only a version that is not out yet: a docs-only merge or a rebuild of the same version never touches
  # a published release (review 2026-09-29, E-2). Pull requests always build and test the installer.
  version:
    name: version to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned: review 2026-09-29, E-22)
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "v$version is already published: nothing to publish"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The whole CI (server on Linux and Windows, API contract, web) must pass before a release goes out (E-1).
  tests:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  installer:
    name: service bundle + installer
    needs: [version, tests]
    # Pull requests: build and test the installer. main: only when a new version passed the tests.
    if: >-
      always() && needs.version.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (needs.version.outputs.publish == 'true' && needs.tests.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # Code signing (owner decision 2 of the review: installs without warnings) turns on by itself once the
      # repository has a certificate in the WINDOWS_CERT_PFX (base64) and WINDOWS_CERT_PASSWORD secrets.
      SIGNING: ${{ secrets.WINDOWS_CERT_PFX != '' && 'true' || 'false' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned: review 2026-09-29, E-22)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Server dependencies
        run: pip install -r server/requirements.txt -r build/windows/requirements.txt

      - name: Build the SPA into server/static_spa
        run: python build/build_spa.py

      - name: Bundle the service (PyInstaller --onedir)
        working-directory: server
        run: pyinstaller ../build/windows/skytowers-server.spec --distpath ../dist-server --workpath ../build-work --noconfirm

      - name: Smoke test the bundle in a console
        env:
          SKYTOWERS_HOME: ${{ runner.temp }}\skyt-console
        run: |
          $exe = (Resolve-Path "dist-server\skytowers-server\skytowers-server.exe").Path
          $out = "$env:RUNNER_TEMP\server-out.txt"; $err = "$env:RUNNER_TEMP\server-err.txt"
          function Fail([string]$message) {
            $log = Get-Content "$env:SKYTOWERS_HOME\logs\server.log" -Tail 40 -ErrorAction SilentlyContinue | Out-String
            $console = Get-Content $out, $err -Tail 40 -ErrorAction SilentlyContinue | Out-String
            $text = "$message`n--- server.log`n$log`n--- console`n$console"
            Write-Output ("::error title=Smoke test::" + ($text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            exit 1
          }
          function Run([string[]]$arguments) {
            $output = & $exe @arguments 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Fail "skytowers-server $($arguments -join ' ') exited $LASTEXITCODE`n$output" }
            $output
          }
          Run @("init", "--role", "reception")
          Run @("manage", "migrate", "-v0")
          Run @("manage", "seed_demo", "--allow-non-debug")
          $server = Start-Process -FilePath $exe -ArgumentList "run" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $status = $null
            foreach ($i in 1..60) {
              try { $status = Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $status) { Fail "the service did not answer on 127.0.0.1:8471" }
            "role=$($status.role) version=$($status.version)"
            $page = Invoke-WebRequest http://127.0.0.1:8471/reservations -UseBasicParsing
            if ($page.Content -notmatch 'id="root"') { Fail "the SPA is not served" }
            $login = Invoke-RestMethod -Method Post http://127.0.0.1:8471/api/v1/auth/password -ContentType "application/json" -Body '{"username":"manager","password":"skytowers-dev"}'
            $auth = @{ Authorization = "Token $($login.token)" }
            $board = Invoke-RestMethod http://127.0.0.1:8471/api/v1/rooms/board -Headers $auth
            if ($board.rooms.Count -ne 30) { Fail "room board has $($board.rooms.Count) rooms" }
            $xlsx = Invoke-WebRequest "http://127.0.0.1:8471/api/v1/reports/debts/export?format=xlsx" -Headers $auth -UseBasicParsing
            if ($xlsx.StatusCode -ne 200) { Fail "Excel export answered $($xlsx.StatusCode)" }
            "smoke test passed"
          } catch {
            Fail "request failed: $($_.Exception.Message)"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install, start and remove the Windows service
        run: |
          $exe = (Resolve-Path "dist-server\skytowers-server\skytowers-server.exe").Path
          function Fail([string]$message) {
            $log = Get-Content "$env:ProgramData\SkyTowers\logs\server.log" -Tail 40 -ErrorAction SilentlyContinue | Out-String
            $query = sc.exe query SkyTowersServer | Out-String
            $events = Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match "SkyTowers|Python" } | Format-List TimeCreated, Message | Out-String
            $text = "$message`n--- sc query`n$query`n--- server.log`n$log`n--- events`n$events"
            Write-Output ("::error title=Windows service::" + ($text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            exit 1
          }
          & $exe init --role reception   # %ProgramData%\SkyTowers\config.json, as the installer does
          $install = & $exe --startup auto install 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "install exited $LASTEXITCODE`n$install" }
          sc.exe start SkyTowersServer
          $ok = $false
          foreach ($i in 1..90) {
            try { Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status | Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Fail "the service did not answer on 127.0.0.1:8471" }
          "service answered"
          sc.exe stop SkyTowersServer
          Start-Sleep -Seconds 5
          & $exe remove

      - name: Build the installer (Tauri 2 → NSIS)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - name: Sign the installer (only when a code-signing certificate is configured)
        if: env.SIGNING == 'true'
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      - name: Install with the built installer and check the installed app end to end
        run: |
          function Fail([string]$message) {
            $log = Get-Content "$env:ProgramData\SkyTowers\logs\server.log" -Tail 40 -ErrorAction SilentlyContinue | Out-String
            $query = sc.exe query SkyTowersServer 2>&1 | Out-String
            $tree = Get-ChildItem "$env:ProgramFiles\Sky Towers" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName } | Out-String
            $text = "$message`n--- sc query`n$query`n--- server.log`n$log`n--- install dir`n$tree"
            Add-Content -Path "$env:RUNNER_TEMP\e2e.log" -Value $text -Encoding utf8
            # Annotations: short and ASCII-only; the full text is in the e2e-log artifact.
            $short = ($text -replace '[^\x20-\x7E]', '?')
            if ($short.Length -gt 1500) { $short = $short.Substring(0, 1500) }
            Write-Output ("::error title=Installer e2e::" + ($short -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'))
            exit 1
          }
          Start-Transcript -Path "$env:RUNNER_TEMP\e2e-transcript.log" | Out-Null
          try {
            $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
            if (-not $setup) { Fail "no installer found under desktop/src-tauri/target/release/bundle/nsis" }
            "installing $($setup.Name) silently"
            # Silent install: the role question answers «نعم» (/SD IDYES) → reception; config.json from the previous step is kept.
            $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "installer exited $($p.ExitCode)" }
            $installed = "$env:ProgramFiles\Sky Towers"
            if (-not (Test-Path "$installed\server\skytowers-server.exe")) { Fail "server exe not installed under $installed" }
            if (-not (Test-Path "$installed\server\_internal\static_spa\index.html")) { Fail "the SPA is not inside the installed server folder" }
            $status = $null
            foreach ($i in 1..90) {
              try { $status = Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $status) { Fail "the installed service did not answer on 127.0.0.1:8471" }
            "status: role=$($status.role) version=$($status.version) spa_built=$($status.spa_built)"
            if (-not $status.spa_built) { Fail "the installed service reports spa_built=false" }
            $page = Invoke-WebRequest http://127.0.0.1:8471/reservations -UseBasicParsing -SkipHttpErrorCheck
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="root"') { Fail "the installed service does not serve the SPA: HTTP $($page.StatusCode)`n$($page.Content.Substring(0, [Math]::Min(600, $page.Content.Length)))" }
            "installed app serves the SPA"
            # An update over the installed build (the same installer again): copy of the database first, the
            # database updated by the installer, the previous server folder gone, the service answering (E-4…E-7).
            $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "the update install exited $($p.ExitCode)" }
            $backups = "$env:ProgramData\SkyTowers\backups"
            $pre = $null; $why = ""
            try { $pre = @(Get-ChildItem -LiteralPath $backups -Directory -Filter "pre-upgrade-*" -Force -ErrorAction Stop) } catch { $why = $_.Exception.Message }
            if (-not $pre -or -not (Test-Path "$($pre[0].FullName)\hotel.db")) {
              $acl = icacls "$env:ProgramData\SkyTowers" 2>&1 | Out-String
              $label = whoami /groups 2>&1 | Select-String "Label|S-1-5-32-544" | Out-String
              $listing = cmd /c dir /s /b "$env:ProgramData\SkyTowers" 2>&1 | Select-Object -First 40 | Out-String
              Fail "no pre-upgrade copy of the database after an update ($why)`n--- icacls`n$acl`n--- whoami`n$label`n--- dir`n$listing"
            }
            if (Test-Path "$installed\server.prev") { Fail "server.prev left behind after a successful update" }
            $status = $null
            foreach ($i in 1..30) {
              try { $status = Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $status) { Fail "the service did not answer after an update" }
            "updated in place: pre-upgrade copy $($pre[0].Name), service answering"
            $un = Get-ChildItem "$installed\*uninstall*.exe" | Select-Object -First 1
            if (-not $un) { Fail "no uninstaller under $installed" }
            $u = Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait -PassThru
            if ($u.ExitCode -ne 0) { Fail "uninstaller exited $($u.ExitCode)" }
            Start-Sleep -Seconds 3
            $after = sc.exe query SkyTowersServer 2>&1 | Out-String
            if ($after -notmatch "1060|FAILED") { Fail "the service is still registered after uninstall:`n$after" }
            "uninstalled cleanly"
          } catch {
            Fail "unexpected error: $($_.Exception.Message)`n$($_.ScriptStackTrace)"
          }
          Stop-Transcript | Out-Null
          # The last native command was `sc.exe query` on a removed service (exit 1060); the pwsh shell would
          # otherwise end the step with that code although every check passed.
          exit 0

      - name: Keep the end-to-end transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-log
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e-transcript.log
          if-no-files-found: ignore

      - name: Post the end-to-end transcript on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A backtick escapes in PowerShell strings: build the Markdown fence and the date outside them (E-3).
          $fence = '```'
          $date = Get-Date -Format u
          $sha = "${{ github.event.pull_request.head.sha }}"
          $body = "### Installer end-to-end ($date, commit $sha)`n`n"
          foreach ($f in @("$env:RUNNER_TEMP\e2e.log", "$env:RUNNER_TEMP\e2e-transcript.log")) {
            if (Test-Path $f) {
              $text = Get-Content $f -Raw -ErrorAction SilentlyContinue
              if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
              $body += "<details><summary>$(Split-Path $f -Leaf)</summary>`n`n$($fence)text`n$text`n$fence`n</details>`n`n"
            }
          }
          $body | Set-Content "$env:RUNNER_TEMP\e2e.md" -Encoding utf8
          gh pr comment $env:PR --body-file "$env:RUNNER_TEMP\e2e.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skytowers-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the installer as a GitHub release (a new version on main, tests passed)
        if: needs.version.outputs.publish == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $name = "SkyTowers-Setup-$version.exe"
          Copy-Item $exe.FullName $name
          # The same file under a fixed name: /releases/latest/download/SkyTowers-Setup.exe is always the newest,
          # so the guide can give one link that never hands out an old version.
          $stable = "SkyTowers-Setup.exe"
          Copy-Item $exe.FullName $stable
          # Never replace a published installer (E-2): a version goes out once; a fix needs a new version number.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "$tag is already published; bump the version to publish again" }
          # SHA256SUMS: the downloaded file can be checked before it is installed (review 2026-09-29, E-22).
          $sums = "SHA256SUMS.txt"
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Set-Content $sums -Encoding ascii
          (Get-FileHash $stable -Algorithm SHA256).Hash.ToLower() + "  $stable" | Add-Content $sums -Encoding ascii
          # The title says what the version brings: «Sky Towers 1.1.11 — …» from its heading in the release notes.
          $heading = Select-String -Path docs/release-notes.md -Encoding utf8 -Pattern ("^### \S+ " + [regex]::Escape($version) + " \((.+)\)\s*$") | Select-Object -First 1
          $title = if ($heading) { "Sky Towers $version — " + $heading.Matches[0].Groups[1].Value } else { "Sky Towers $version" }
          gh release create $tag $name $stable $sums --title $title --notes-file docs/release-notes.md --target $env:GITHUB_SHA
          "published $tag"
