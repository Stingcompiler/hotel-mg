name: Windows release

# Track W (spec §12): the Windows service bundle and the NSIS installer, built and smoke-tested on
# windows-latest because a Linux session cannot. Runs on every change to the Windows pieces, on
# `v*` tags, and on demand; the installer is uploaded as an artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "desktop/**"
      - "build/windows/**"
      - "build/build_spa.py"
      - "server/service/**"
      - "server/requirements.txt"
      - ".github/workflows/windows-release.yml"

jobs:
  installer:
    name: service bundle + installer
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Server dependencies
        run: pip install -r server/requirements.txt pyinstaller==6.16.0

      - name: Build the SPA into server/static_spa
        run: python build/build_spa.py

      - name: Bundle the service (PyInstaller --onedir)
        working-directory: server
        run: pyinstaller ../build/windows/skytowers-server.spec --distpath ../dist-server --workpath ../build-work --noconfirm

      - name: Smoke test the bundle in a console
        run: |
          $exe = "dist-server\skytowers-server\skytowers-server.exe"
          $env:SKYTOWERS_HOME = "$env:RUNNER_TEMP\skyt-console"
          & $exe init --role reception
          & $exe manage migrate -v0
          & $exe manage seed_demo --allow-non-debug
          $server = Start-Process -FilePath $exe -ArgumentList "run" -PassThru -NoNewWindow
          $status = $null
          foreach ($i in 1..40) {
            try { $status = Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $status) { throw "service did not answer" }
          "role=$($status.role) version=$($status.version)"
          $page = Invoke-WebRequest http://127.0.0.1:8471/reservations -UseBasicParsing
          if ($page.Content -notmatch 'id="root"') { throw "SPA not served" }
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:8471/api/v1/auth/password -ContentType "application/json" -Body '{"username":"manager","password":"skytowers-dev"}'
          $board = Invoke-RestMethod http://127.0.0.1:8471/api/v1/rooms/board -Headers @{ Authorization = "Token $($login.token)" }
          if ($board.rooms.Count -ne 30) { throw "room board: $($board.rooms.Count) rooms" }
          $xlsx = Invoke-WebRequest "http://127.0.0.1:8471/api/v1/reports/debts/export?format=xlsx" -Headers @{ Authorization = "Token $($login.token)" } -UseBasicParsing
          if ($xlsx.StatusCode -ne 200) { throw "Excel export failed" }
          Stop-Process -Id $server.Id -Force

      - name: Install, start and remove the Windows service
        run: |
          $exe = (Resolve-Path "dist-server\skytowers-server\skytowers-server.exe").Path
          & $exe init --role reception          # %ProgramData%\SkyTowers\config.json, as the installer does
          & $exe --startup auto install
          sc.exe start SkyTowersServer
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8471/api/v1/system/status | Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          sc.exe query SkyTowersServer
          if (-not $ok) { Get-Content "$env:ProgramData\SkyTowers\logs\server.log" -ErrorAction SilentlyContinue; throw "service did not answer" }
          sc.exe stop SkyTowersServer
          Start-Sleep -Seconds 5
          & $exe remove

      - name: Build the installer (Tauri 2 → NSIS)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: skytowers-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
