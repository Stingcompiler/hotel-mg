components:
  schemas:
    ActionEnum:
      enum:
      - extend
      - confirm_checkout
      - waiting
      - snooze
      - done
      type: string
      description: |-
        * `extend` - تمديد
        * `confirm_checkout` - تأكيد المغادرة
        * `waiting` - بانتظار الرد
        * `snooze` - تأجيل
        * `done` - تم
    ActionRequest:
      type: object
      properties:
        action:
