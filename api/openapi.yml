      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
          description: ''
  /api/v1/followups/tasks:
    get:
      operationId: followups_tasks_list
      description: 'Spec §10.4: ``tasks?status=open`` (open, snoozed, waiting, neglected)
        and ``&count`` for badges.'
      parameters:
      - in: query
        name: count
        schema:
          type: boolean
        description: 'Deprecated: returns the TaskCount shape; use tasks/count.'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - open
      tags:
      - followups
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRow'
          description: ''
  /api/v1/followups/tasks/{id}:
    get:
      operationId: followups_task_history
      description: The task's action history.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - followups
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskAction'
          description: ''
  /api/v1/followups/tasks/{id}/actions:
    post:
      operationId: followups_tasks_actions_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - followups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
          application/x-www-form-urlencoded:
