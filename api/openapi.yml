openapi: 3.0.3
info:
  title: Sky Towers API
  version: 1.0.0
  description: Local API of the Sky Towers hotel management system.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_list
      description: Read-only audit trail, newest first (Settings → سجل التدقيق).
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - login
          - other
          - override
          - payment
          - reversal
          - sensitive
          - settings
          - stay
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD inclusive
      - in: query
        name: entity
        schema:
          type: string
        description: e.g. user, room, stay
      - in: query
        name: id
        schema:
          type: string
        description: Entity id
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: User name, action, entity or exact id
      tags:
      - audit
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/verify:
    get:
      operationId: audit_verify_retrieve
      tags:
      - audit
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerify'
          description: ''
  /api/v1/auth/confirm:
    post:
      operationId: auth_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmToken'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/pin:
    post:
      operationId: auth_pin_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/setup:
    post:
      operationId: auth_setup_create
      description: 'First run: create the first manager when the reception PC has
        no users (login screen «إعداد النظام»).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/users:
    get:
      operationId: auth_users_list
      description: Active users for the login screen's picker (names and roles only).
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginUser'
          description: ''
  /api/v1/backup/adopt:
    post:
      operationId: backup_adopt_create
      description: '1.1: a new PC opens a hotel from a backup, when the owner chooses
        to — view only or work on it.'
      tags:
      - backup
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdoptRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptResult'
          description: ''
  /api/v1/backup/drive/auth-url:
    post:
      operationId: backup_drive_auth_url_create
      description: '«ربط حساب» (manager): opens Google''s consent page; Google returns
        to ``…/drive/callback``.'
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUrl'
          description: ''
  /api/v1/backup/drive/status:
    get:
      operationId: backup_drive_status_retrieve
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveStatus'
          description: ''
  /api/v1/backup/drive/sync:
    post:
      operationId: backup_drive_sync_create
      description: '«مزامنة مع Drive»: reception uploads pending backups; the owner
        PC downloads newer ones.'
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
          description: ''
  /api/v1/backup/drive/unlink:
    post:
      operationId: backup_drive_unlink_create
      description: «فصل الحساب» (manager).
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveStatus'
          description: ''
  /api/v1/backup/run:
    post:
      operationId: backup_run_create
      description: '«نسخة احتياطية الآن» (artboard 6.13): writes the encrypted file
        now; the result line shows it.'
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRun'
          description: ''
  /api/v1/backup/runs:
    get:
      operationId: backup_runs_list
      description: '«سجل التشغيل»: backup runs, newest first.'
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBackupRunList'
          description: ''
  /api/v1/backup/settings:
    get:
      operationId: backup_settings_retrieve
      tags:
      - backup
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSettings'
          description: ''
    patch:
      operationId: backup_settings_partial_update
      tags:
      - backup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBackupSettingsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBackupSettingsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBackupSettingsUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupSettings'
          description: ''
  /api/v1/expenses/:
    get:
      operationId: expenses_list
      description: 'Artboard 6.8: «هذه الوردية / اليوم / هذا الشهر» and a category
        filter.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - month
          - shift
          - today
        description: 'Default: month'
      tags:
      - expenses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpenseList'
          description: ''
    post:
      operationId: expenses_create
      description: 'Artboard 6.8: «هذه الوردية / اليوم / هذا الشهر» and a category
        filter.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - month
          - shift
          - today
        description: 'Default: month'
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/expenses/{id}/attachments:
    post:
      operationId: expenses_attachments_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/expenses/{id}/attachments/{att_pk}:
    get:
      operationId: expenses_attachments_retrieve
      parameters:
      - in: path
        name: att_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/expenses/{id}/receipt:
    get:
      operationId: expenses_receipt_retrieve
      description: Data for the 80 mm expense slip (artboard 7.2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseReceiptDocument'
          description: ''
  /api/v1/expenses/{id}/reverse:
    post:
      operationId: expenses_reverse_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/expenses/summary:
    get:
      operationId: expenses_summary_retrieve
      tags:
      - expenses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
          description: ''
  /api/v1/folios/{id}:
    get:
      operationId: folios_retrieve
      description: Totals and the ledger with running balance (artboard 6.5 «الفاتورة»).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folio'
          description: ''
  /api/v1/folios/{id}/invoice:
    get:
      operationId: folios_invoice_retrieve
      description: Data for the A4 invoice (artboard 7.1).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDocument'
          description: ''
  /api/v1/folios/{id}/lines:
    post:
      operationId: folios_lines_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LineCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LineCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folio'
          description: ''
  /api/v1/folios/{id}/lines/{line_pk}/reverse:
    post:
      operationId: folios_lines_reverse_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: line_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folio'
          description: ''
  /api/v1/folios/{id}/payments:
    post:
      operationId: folios_payments_create
      description: Needs an open shift on this device (409 ``no_open_shift``).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/folios/{id}/refunds:
    post:
      operationId: folios_refunds_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - folios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/followups/board:
    get:
      operationId: followups_board_retrieve
      description: 'Follow-ups screen (artboard 6.6): متأخرة / اليوم / القادمة and
        system tasks. Poll every 30 s.'
      tags:
      - followups
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/followups/rules:
    get:
      operationId: followups_rules_list
      tags:
      - followups
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
          description: ''
    post:
      operationId: followups_rules_create
      tags:
      - followups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/v1/followups/rules/{id}:
    patch:
      operationId: followups_rules_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - followups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/v1/followups/rules/preview:
    post:
      operationId: followups_rules_preview_create
      description: 'Live preview while editing a rule (artboard 6.11: «معاينة — إقامة
        شهرية تنتهي …»).'
      tags:
      - followups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreviewRequestRequest'
