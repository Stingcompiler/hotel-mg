        file:
          type: string
          format: binary
      required:
      - file
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخر دخول
        locked_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        default_password:
          type: boolean
          readOnly: true
          description: Still the install's default password (the login page shows
            it; a reminder after login).
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - username
      - full_name
      - role
      - is_active
      - last_login
      - locked_until
      - default_password
      - version
      - created_at
      - updated_at
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        pin:
          type: string
          minLength: 1
          maxLength: 6
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - full_name
      - pin
      - role
      - username
    UserRoleEnum:
      enum:
      - owner
      - manager
      - reception
      type: string
      description: |-
        * `owner` - المالك
        * `manager` - مدير
        * `reception` - استقبال
    VersionRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
    Week:
      type: object
      properties:
        label:
          type: string
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        revenue:
          type: integer
        collected:
          type: integer
      required:
      - label
      - date_from
      - date_to
      - revenue
      - collected
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
